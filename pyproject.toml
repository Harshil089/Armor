[project]
name = "armor"
version = "0.1.0"
description = "Open-source, low-latency AI content security engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "torch>=2.2",
    "transformers>=4.48",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["datasets>=3.0"]
ner = ["spacy>=3.7"]
onnx = ["optimum[onnxruntime]>=1.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["armor*"]
